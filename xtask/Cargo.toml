[package]
name = "xtask"
version = "0.0.0"
description = "Repository automation for Shiin (not published)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
memory-profile = ["dep:allocation-counter"]

[dependencies]
allocation-counter = { workspace = true, optional = true }
jsonschema = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
shiin-engine = { workspace = true }
shiin-audit = { workspace = true }
shiin-policy = { workspace = true }
shiin-schema = { workspace = true, features = ["runtime"] }

[lints]
workspace = true
