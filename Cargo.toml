[workspace]
resolver = "3"
members = [
  "crates/shiin-audit",
  "crates/shiin-classify",
  "crates/shiin-cli",
  "crates/shiin-engine",
  "crates/shiin-hooks",
  "crates/shiin-policy",
  "crates/shiin-schema",
  "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/BAGOMBEKA-JOB-DEV/shiin"
authors = ["The Shiin Contributors"]

[workspace.dependencies]
cedar-policy = "4"
getrandom = "0.3"
globset = "0.4"
jsonschema = { version = "0.56", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11"
shiin-audit = { path = "crates/shiin-audit" }
shiin-classify = { path = "crates/shiin-classify" }
shiin-engine = { path = "crates/shiin-engine" }
shiin-hooks = { path = "crates/shiin-hooks" }
shiin-policy = { path = "crates/shiin-policy" }
shiin-schema = { path = "crates/shiin-schema" }
thiserror = "2"
toml = "0.9"
regex = "1.13"
serde_json = "1.0.151"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
