# rumdl configuration: https://github.com/rvben/rumdl
# Shiin writes one sentence per line (see docs/project/docs-style-guide.md), so line length is not limited (MD013).
# The style guide uses `$` prompts in `console` blocks even when no output is shown (MD014).

[global]
disable = ["MD013", "MD014"]
# .kilo/ holds another tool's planning notes, and a pull-request template body has no title (MD041).
exclude = [
  "target",
  ".kilo",
  "docs/mermaid.min.js",
  "docs/mermaid-init.js",
  ".github/PULL_REQUEST_TEMPLATE.md",
]
