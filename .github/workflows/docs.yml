name: docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install documentation tools
        run: >-
          cargo binstall --no-confirm --locked
          mdbook@0.5.4 mdbook-mermaid@0.17.1 lychee@0.24.2 typos-cli@1.50.1 rumdl@0.2.73

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint repository tooling
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation rules
        run: cargo xtask docs-check

      - name: Measure intent binding against the labelled corpus
        run: cargo xtask intent-evaluation

      - name: Refuse network stacks and async runtimes in engine crates
        run: cargo xtask dependency-check

      - name: Generate the core conformance bundle
        run: cargo xtask conformance

      - name: Publish the core conformance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-conformance
          path: target/conformance
          if-no-files-found: error

      - name: Run the tests, including the specification conformance corpus
        run: cargo test --workspace

      - name: Lint Markdown
        run: rumdl check .

      - name: Check spelling
        run: typos

      - name: Check links and anchors
        run: lychee --config lychee.toml './*.md' docs

      - name: Build the book
        run: mdbook build docs

      - name: Upload documentation site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/book

  deploy:
    name: Publish documentation
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the checked book
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
