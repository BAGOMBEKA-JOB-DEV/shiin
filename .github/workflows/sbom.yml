name: sbom

# Release SBOMs are produced and uploaded by cargo-dist. This manual job provides
# an additional JSON diagnostic without racing release publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: software bill of materials
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install cargo-cyclonedx
        run: cargo binstall --no-confirm --locked cargo-cyclonedx

      - name: Generate the bill of materials for the shiin binary
        run: |
          cargo cyclonedx --format json --spec-version 1.5 \
            --manifest-path crates/shiin-cli/Cargo.toml
          mv crates/shiin-cli/shiin-cli.cdx.json "shiin-${GITHUB_REF_NAME}.cdx.json"

      - name: Upload it as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: shiin-*.cdx.json
          if-no-files-found: error

