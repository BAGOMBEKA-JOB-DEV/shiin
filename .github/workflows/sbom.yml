name: sbom

# Release SBOMs are produced and uploaded by cargo-dist. This manual job provides
# an additional JSON diagnostic without racing release publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: software bill of materials
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # v1.25.3

      - name: Install cargo-cyclonedx
        run: cargo binstall --no-confirm --locked cargo-cyclonedx

      - name: Generate the bill of materials for the shiin binary
        run: |
          cargo cyclonedx --format json --spec-version 1.5 \
            --manifest-path crates/shiin-cli/Cargo.toml
          mv crates/shiin-cli/shiin-cli.cdx.json "shiin-${GITHUB_REF_NAME}.cdx.json"

      - name: Upload it as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: shiin-*.cdx.json
          if-no-files-found: error

