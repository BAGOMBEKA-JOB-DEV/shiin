name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.tier == 2 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1 platforms block a release; see docs/reference/platform-support.md.
          - os: ubuntu-24.04
            tier: 1
          - os: macos-15
            tier: 1
          # Tier 2 is built and shipped with limited testing, so it does not block.
          - os: windows-2025
            tier: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p xtask --features memory-profile --all-targets -- -D warnings

      - name: Test, including the specification conformance corpus
        run: cargo test --workspace --locked

  performance:
    name: release latency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: performance

      - name: Build the optimized CLI and measurement tool
        run: cargo build --release --workspace --locked

      - name: Check engine, compilation, and hook latency budgets
        run: cargo run --release --locked -p xtask -- performance target/release/shiin

      - name: Check budgets with larger policies and audit logs
        run: cargo run --release --locked -p xtask -- performance-scaling target/release/shiin

      - name: Check bounded component heap allocation
        run: cargo run --release --locked -p xtask --features memory-profile -- memory

  engine-purity:
    name: engine WebAssembly purity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain and WebAssembly target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: engine-wasm

      - name: Check isolated engine without runtime capabilities
        run: cargo check --locked -p shiin-engine --target wasm32-unknown-unknown

      - name: Test wire types without OS clock or randomness
        run: cargo test --locked -p shiin-schema --no-default-features

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version here must match `rust-version` in Cargo.toml.
      - name: Install the minimum supported toolchain
        run: rustup toolchain install 1.96 --profile minimal

      - name: Build with the minimum supported toolchain
        run: cargo +1.96 check --workspace --locked

  supply-chain:
    name: dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install cargo-deny
        run: cargo binstall --no-confirm --locked cargo-deny

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      # `dist generate` rewrites release.yml with tag references, so this catches a
      # regeneration that dropped the pins required by ADR-0038.
      - name: Check that every action is pinned by commit
        run: |
          if grep -rnE 'uses: [^@]+@(v[0-9]|main|master)' .github/workflows/; then
            echo "::error::an action is pinned by tag or branch; pin it by commit SHA"
            exit 1
          fi

      - name: Check generated release SBOM upload reference
        run: cargo xtask release-ci-fix --check
