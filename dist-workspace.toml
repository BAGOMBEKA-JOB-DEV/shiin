[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# ADR-0038 requires every action to be pinned by commit, and dist writes tag
# references, so release.yml is edited after generation. This tells dist not to fail
# on that difference; ci.yml enforces the pins instead.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Tier 1 first, then Tier 2; see docs/reference/platform-support.md.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
  "x86_64-apple-darwin",
]
# Build provenance, so a downloaded binary can be traced to this repository and commit.
github-attestations = true
