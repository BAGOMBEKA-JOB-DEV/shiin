[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Exercise packaging on hosted pull-request runners before publishing a tag.
pr-run-mode = "upload"
cargo-auditable = true
cargo-cyclonedx = true
# Rust automation repairs the upstream SBOM output reference after generation.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Tier 1 first, then Tier 2; see docs/reference/platform-support.md.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-musl",
  "x86_64-apple-darwin",
]
# Build provenance, so a downloaded binary can be traced to this repository and commit.
github-attestations = true

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
