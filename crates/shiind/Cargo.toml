[package]
name = "shiind"
version = "0.0.0"
description = "Shiin's local approval daemon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
base64.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
shiin-approval.workspace = true
shiin-audit = { workspace = true, features = ["keyring"] }
shiin-classify.workspace = true
shiin-engine.workspace = true
shiin-ipc.workspace = true
shiin-policy.workspace = true
shiin-schema = { workspace = true, features = ["runtime"] }
tokio = { workspace = true, features = ["net", "io-util", "rt-multi-thread", "time", "sync", "signal", "macros"] }

[lints]
workspace = true
