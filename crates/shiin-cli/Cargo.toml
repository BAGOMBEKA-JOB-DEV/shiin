[package]
name = "shiin-cli"
version.workspace = true
description = "The shiin command-line interface"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# `publish = false` would otherwise hide this binary from dist.
[package.metadata.dist]
dist = true

[[bin]]
name = "shiin"
path = "src/main.rs"

[dependencies]
base64.workspace = true
rpassword.workspace = true
serde_json = { workspace = true }
sha2.workspace = true
shiin-audit = { workspace = true, features = ["keyring"] }
shiin-approval.workspace = true
shiin-classify = { workspace = true }
shiin-engine = { workspace = true }
shiin-hooks = { workspace = true }
shiin-ipc = { workspace = true }
shiin-policy = { workspace = true }
shiin-schema = { workspace = true, features = ["runtime"] }

[dev-dependencies]
ed25519-dalek.workspace = true
jsonschema = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
