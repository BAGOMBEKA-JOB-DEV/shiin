[package]
name = "shiin-audit"
version.workspace = true
description = "Shiin's append-only, hash-chained audit log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = []
receipts = ["dep:chrono", "dep:base64", "dep:ed25519-dalek", "dep:chacha20poly1305"]
keyring = ["receipts", "dep:keyring-core", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store", "dep:dbus-secret-service-keyring-store", "dep:getrandom", "dep:zeroize"]

[dependencies]
chrono = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shiin-schema = { workspace = true, features = ["runtime"] }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true, optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust", "vendored"], optional = true }

[lints]
workspace = true
