[package]
name = "shiin-audit"
version = "0.0.0"
description = "Shiin's append-only, hash-chained audit log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = []
receipts = ["dep:chrono", "dep:base64", "dep:ed25519-dalek", "dep:chacha20poly1305"]
keyring = ["receipts", "dep:keyring", "dep:getrandom", "dep:zeroize"]

[dependencies]
chrono = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shiin-schema = { workspace = true, features = ["runtime"] }
thiserror = { workspace = true }

[lints]
workspace = true
